name: gym-web CI

on:
  push:
    branches:
      - main
      - dev
      - stage

env:
  NODE_VERSION: 22.x
  IMAGE_NAME: devictor17/gym-web
  HELM_REPO: Ransomdvictor/Helmchart-Project

jobs:

  # ==============================
  # BUILD AND PUSH DOCKER IMAGE
  # ==============================
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --ci

      - name: Build application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}


  # ==============================
  # UPDATE HELM CHART
  # ==============================
  update-helm-chart:
    needs: docker
    runs-on: ubuntu-latest

    # Only update the Helm repository from main
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          ref: main
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Update values.yaml with new image tag
        env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}

        run: |
          CHART_VALUES_FILE=""

          for candidate in values.yaml gym-web/values.yaml chart/values.yaml; do
            if [ -f "$candidate" ]; then
              CHART_VALUES_FILE="$candidate"
              break
            fi
          done

          if [ -z "$CHART_VALUES_FILE" ]; then
            echo "Could not find values.yaml in the chart repo."
            find . -maxdepth 3 -name values.yaml -print
            exit 1
          fi

          echo "Updating: $CHART_VALUES_FILE"
          echo "New image tag: $NEW_TAG"

          yq -i '.image.tag = strenv(NEW_TAG)' "$CHART_VALUES_FILE"

      - name: Commit and push Helm update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No Helm chart change detected."
            exit 0
          fi

          git commit -m "Update gym-web image tag to ${{ needs.docker.outputs.image_tag }}"

          git push