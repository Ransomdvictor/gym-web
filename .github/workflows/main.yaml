name: gym-web CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 20.x
  IMAGE_NAME: devictor17/gym-web
  HELM_REPO: Ransomdvictor/Helmchart-Project

jobs:

  # ==========================================================
  # 1. BUILD APPLICATION
  # ==========================================================
  validate:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  # ==========================================================
  # 2. LINT HELM CHART
  # ==========================================================
  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Helm chart
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ secrets.HELM_REPO_PAT }}
          path: helm-chart

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm-chart


  # ==========================================================
  # 3. BUILD AND PUSH DOCKER IMAGE
  # ==========================================================
  docker:
    name: Build and push Docker image
    needs:
      - validate
      - helm-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}


  # ==========================================================
  # 4. UPDATE HELM IMAGE TAG
  # ==========================================================
  update-helm-chart:
    name: Update Helm image tag
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Helm repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.Ransomdvictor/Helmchart-Project }}
          token: ${{ secrets.HELM_REPO_PAT }}
          path: helm-chart

      - name: Update image tag
        run: |
          sed -i "s/^  tag:.*/  tag: \"${GITHUB_SHA::8}\"/" helm-chart/values.yaml

      - name: Commit and push Helm update
        run: |
          cd helm-chart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add values.yaml

          git diff --cached --quiet || git commit -m "Update gym-web image tag to ${GITHUB_SHA::8}"

          git push